# Pre-fetches revenue-growth/profit-margin/FCF-margin trends for foreign-
# filer tickers (Canadian banks/miners, UK pharma, etc.) from SEC EDGAR's
# free companyfacts API, published to the SAME public Gist stock-metrics-
# pipeline already publishes to (see scripts/generateForeignFilingsCache.js
# for the full rationale and design). This is a separate repo/pipeline from
# stock-metrics-pipeline because it talks to a completely different data
# source (SEC EDGAR, not Finnhub/Twelve Data) for a narrow, distinct
# purpose — foreign private issuers that Finnhub's financials-reported
# endpoint has no data for at all.
#
# Scheduled at a time that doesn't collide with stock-metrics-pipeline's
# three jobs (00:00 UTC main pipeline — moved earlier and grown to
# ~6.5-7.5hrs after adding full Quarterly/Yearly/TTM trend caching there,
# worst-case finish ~11:00 UTC with GitHub's observed scheduling delay;
# 12:00 UTC P/FCF trend cache — also pushed later for the same reason;
# 16:00 UTC news cache) — this job talks only to SEC, not Finnhub/Twelve
# Data, so there's no shared rate-limit budget to protect; the gap is
# purely to avoid concurrent writes to the same Gist.
#
# One-time setup required (this workflow can't do these for you):
#   1. Add a repository secret named GIST_ID — the SAME Gist ID
#      stock-metrics-pipeline already publishes marketMetrics.json/
#      newsCache.json/pfcfTrendCache.json to.
#   2. Add a repository secret named GIST_TOKEN — the SAME kind of
#      Personal Access Token stock-metrics-pipeline uses (CLASSIC type,
#      scoped to ONLY "gist").
# No Finnhub or Twelve Data key needed — this pipeline only calls SEC's
# free, keyless EDGAR API.
#
# ENABLE_FILING_TEXT_FALLBACK is on below (no FILING_TEXT_FALLBACK_TICKERS
# allowlist, so it applies to every ticker whose XBRL quarterly is empty) —
# promoted out of the staged manual-testing phase after this session's
# reconciliation fixes (cross-filing corroboration, multi-quarter chain
# matching, several header-shape/label-matching bugs) verified real
# improvement across a representative sample of the foreign-filer gap
# population (~35% success rate across 126 previously-empty tickers,
# spanning 4 distinct root-cause buckets, up from ~0%).
#
# ENABLE_BUSINESSQUANT_FALLBACK is NOT enabled here yet - a last-resort
# fundamentals fallback (scripts/lib/businessQuantFallback.js) for tickers/
# concepts still empty after both SEC XBRL and the 6-K filing-text
# fallback above. Verified live to genuinely close gaps the 6-K pipeline
# structurally can't (e.g. tickers with no cross-filing corroboration
# available), but the free tier is capped at 120 requests/day - not yet
# tested at full-population scale, and a daily cron run would need real
# budgeting against that cap before enabling by default. To try it on a
# manual workflow_dispatch run in the meantime, add a BUSINESSQUANT_API_KEY
# repository secret (already added) and set ENABLE_BUSINESSQUANT_FALLBACK=1
# as an env var on the "Generate foreign filings cache" step below.
#
# SHARD 1 of 3 -- split from a single daily run 2026-09-18 after
# foreignFilerList.json grew from 764 to 1108 tickers (+45%, a direct
# side-effect of stock-metrics-pipeline's own ADR-universe fix finally
# landing durably) pushed the real full-list runtime to ~11 hours at
# observed pace -- nowhere near fitting in one 350-minute job regardless of
# request-throttle tuning (see MIN_REQUEST_INTERVAL_MS's own comment in
# scripts/lib/extractFilingTextFacts.js for that earlier, now-insufficient-
# alone fix). Each shard processes every Nth ticker (SHARD_INDEX/SHARD_COUNT
# in generateForeignFilingsCache.js's main()) so the three runs are
# disjoint by construction -- no ticker is ever double-processed or
# skipped. TARGET_SYMBOL (debug/backfill dispatches) bypasses sharding
# entirely on any of the three, so any one ticker can always be reached
# from whichever shard workflow is convenient. Shares a concurrency group
# with shards 2 and 3 (see generate-foreign-filings-cache-2.yml/-3.yml) --
# same "schedule spacing alone isn't a real guarantee" lesson already
# learned the hard way in stock-metrics-pipeline (apply-dcf-cap.yml's own
# header documents GitHub's observed 10-14hr scheduling-delay variance),
# applied here preemptively rather than after a real collision.

name: Generate foreign filings cache

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Optional: process only this ticker (or comma-separated list), ignoring the normal gap list/rotation'
        required: false
        type: string
      enableBusinessQuant:
        description: 'Optional: set to 1 to also try the BusinessQuant last-resort fallback for this run (staged manual testing only -- see the header comment above)'
        required: false
        type: string
      debugFilingExtract:
        description: 'Optional: set to 1 to trace per-filing discovery/extraction (DEBUG_FILING_EXTRACT) -- useful when diagnosing why a specific ticker is not producing results'
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: foreign-filings-gist-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # Bumped from 120, then from 180 - verified live: with
    # ENABLE_FILING_TEXT_FALLBACK on for every gap ticker (not a curated
    # allowlist), a real run (31626078351) only reached 2050/5070 tickers
    # (40%) in the full 120 minutes before being cancelled, since main()
    # checks every ticker in the covered universe for genuine IFRS status
    # first, and the fallback does a real, much heavier SEC scan (up to
    # 25+ filings, cross-filing corroboration checks) for each one that
    # qualifies. Pace wasn't linear (later batches sped up as more non-
    # foreign-filers got quickly skipped), but a conservative extrapolation
    # from the observed average put a full run around ~5 hours - set just
    # under GitHub Actions' own 360-minute hard cap for a single job on
    # standard runners, which this can't exceed regardless.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate foreign filings cache
        env:
          ENABLE_FILING_TEXT_FALLBACK: '1'
          SHARD_INDEX: '1'
          SHARD_COUNT: '3'
          TARGET_SYMBOL: ${{ inputs.symbol }}
          DEBUG_FILING_EXTRACT: ${{ inputs.debugFilingExtract }}
          ENABLE_BUSINESSQUANT_FALLBACK: ${{ inputs.enableBusinessQuant }}
          BUSINESSQUANT_API_KEY: ${{ secrets.BUSINESSQUANT_API_KEY }}
          FILING_TEXT_FALLBACK_TICKERS: ${{ inputs.enableBusinessQuant && inputs.symbol || '' }}
          # The scheduled 2026-09-10 run OOM-crashed at ~500/767 tickers,
          # Node's heap pinned near its own ~4GB default ceiling (confirmed
          # via the run's crash log) -- well under this runner's real 16GB
          # RAM (standard ubuntu-latest spec), so raising V8's own ceiling
          # gives real headroom without risking the container's physical
          # limit. A stopgap, not a fix for whatever's actually growing
          # across the run (see the per-50-ticker heapUsed/rss logging
          # added alongside this -- gives real data to root-cause the
          # underlying growth on a future run without needing full
          # heap-profiling tooling in CI).
          NODE_OPTIONS: '--max-old-space-size=12288'
        run: node scripts/generateForeignFilingsCache.js

      - name: Publish to gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -e
          # A crash the JS-level uncaughtException handler can't catch (a
          # hard SIGKILL, most likely an OOM kill -- see generateForeignFilingsCache.js's
          # own comment on its periodic mid-loop checkpoint write) could in
          # principle still leave this file missing entirely if it happens
          # before the very first checkpoint. Fail with a clear message here
          # instead of letting `cp` crash on a missing source file with a
          # confusing raw error -- verified live 2026-09-24/25: exactly this
          # `cp: cannot stat 'foreignFilingsCache.json': No such file or
          # directory` failure, with no indication anywhere in the log of
          # what actually went wrong upstream.
          if [ ! -f foreignFilingsCache.json ]; then
            echo "::error::foreignFilingsCache.json was never written this run (the generate step likely crashed before its first checkpoint, e.g. an OOM kill -- see generateForeignFilingsCache.js's own comment). Nothing to publish; failing loudly (via the existing Report-failure issue) instead of the confusing raw 'cp: cannot stat' error, and instead of silently reporting success with nothing published."
            exit 1
          fi
          CLONE_URL="https://${GIST_TOKEN}@gist.github.com/${GIST_ID}.git"
          attempt=1
          while true; do
            rm -rf gist-clone
            git clone --depth 1 "$CLONE_URL" gist-clone
            if diff -q foreignFilingsCache.json gist-clone/foreignFilingsCache.json >/dev/null 2>&1; then
              echo "No changes to publish."
              break
            fi
            EXPECTED_SHA=$(git -C gist-clone rev-parse HEAD)
            cp foreignFilingsCache.json gist-clone/foreignFilingsCache.json
            ( cd gist-clone
              git config user.email "actions@github.com"
              git config user.name "foreign-filings-pipeline"
              git checkout --orphan latest-snapshot
              git add -A
              git commit -m "Update foreign filings cache $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git branch -M main
              git push --force-with-lease="main:${EXPECTED_SHA}" origin main
            ) && { echo "Published on attempt $attempt."; break; }
            attempt=$((attempt + 1))
            if [ "$attempt" -gt 5 ]; then
              echo "::error::Publish rejected 5 times in a row -- the gist kept changing underneath this run. Not forcing; re-dispatch once things settle."
              exit 1
            fi
            echo "Push rejected (remote moved since clone) — retrying (attempt ${attempt}/5)..."
          done

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Foreign filings pipeline failed',
                body: `The daily generation run failed.\n\nRun: ${runUrl}\n\nCheck the GIST_TOKEN and GIST_ID secrets, and SEC EDGAR's API status.`,
                labels: [label],
              });
            }

      - name: Close failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'pipeline-failure';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Pipeline succeeded again — closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
