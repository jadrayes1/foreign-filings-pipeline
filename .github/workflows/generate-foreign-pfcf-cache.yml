# Pre-fetches a P/FCF trend (Quarterly/Yearly/TTM) for FOREIGN-FILER
# tickers — see scripts/generateForeignPfcfCache.js for the full rationale
# (why this needs its own script/workflow separate from
# generate-foreign-filings-cache.yml: it needs Twelve Data historical
# prices on top of SEC filings, a separate provider with its own
# rate-limit budget, the same reason stock-metrics-pipeline splits its own
# P/FCF job from its main daily one).
#
# Scheduled after the other 4 jobs sharing this Gist (00:00 UTC main
# pipeline, ~12:00 UTC stock-metrics-pipeline's own P/FCF job, 14:00 UTC
# this repo's foreign-filings-cache job, 16:00 UTC news cache) — this job
# talks to SEC + Twelve Data, not Finnhub, so there's no shared rate-limit
# budget with any of them to protect (a SEPARATE Twelve Data key from
# stock-metrics-pipeline's own P/FCF job — see below), the gap is purely to
# avoid concurrent writes to the same Gist. Estimate, not yet measured
# against a real run — re-tune if needed once real data comes in, same
# caveat every other workflow in this project already carries.
#
# One-time setup required (this workflow can't do these for you):
#   1. Sign up for a free Twelve Data account (a DIFFERENT one from
#      whichever you used for stock-metrics-pipeline's own P/FCF job, or
#      the app proxy's live-fallback key) and add its key as a repository
#      secret named TWELVEDATA_FOREIGN_PIPELINE_API_KEY.
#   2. Reuses the SAME GIST_ID/GIST_TOKEN secrets already set up for this
#      repo's generate-foreign-filings-cache.yml — no changes needed there.
# No SEC key needed — that half of this pipeline only calls SEC's free,
# keyless EDGAR API.

name: Generate foreign P/FCF cache

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Optional: process only this ticker (debugging), ignoring the normal gap list/rotation'
        required: false
        type: string
      debug:
        description: 'Optional: set to 1 for verbose extraction/reconciliation tracing (DEBUG_FILING_EXTRACT)'
        required: false
        type: string
      dryRun:
        description: 'Optional: set to 1 to skip publishing to the gist (debugging only)'
        required: false
        type: string

permissions:
  contents: read
  issues: write

# Deliberately NOT sharing the foreign-filings-gist-publish concurrency
# group the other workflows in this repo use. Tried that first, but it
# backfired live: GitHub Actions only keeps the NEWEST queued (not yet
# started) run in a concurrency group, cancelling older queued ones -- and
# this job's own daily schedule can land while a 3+ hour foreign-filings-
# cache shard is running, so it got silently cancelled instead of just
# delayed the very first time this happened (2026-09-19, the same day the
# group was added). This job doesn't actually need that same-repo
# serialization the way the other workflows do -- the git-clone +
# force-with-lease + retry pattern below is what actually protects against
# a real collision (including the cross-repo one with stock-metrics-
# pipeline's own generate-pfcf-trend-cache.yml, which a same-repo group
# could never have covered anyway), so running ungated here costs nothing
# in safety and avoids this job being starved by unrelated, much longer
# jobs in the same repo.

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate foreign P/FCF cache
        env:
          TWELVEDATA_FOREIGN_PIPELINE_API_KEY: ${{ secrets.TWELVEDATA_FOREIGN_PIPELINE_API_KEY }}
          TARGET_SYMBOL: ${{ inputs.symbol }}
          DEBUG_FILING_EXTRACT: ${{ inputs.debug }}
        run: node scripts/generateForeignPfcfCache.js

      - name: Dry-run output (debugging only)
        if: ${{ inputs.dryRun }}
        env:
          TARGET_SYMBOL: ${{ inputs.symbol }}
        run: |
          node -e "const d = require('./foreignPfcfCache.json').trends; for (const s of (process.env.TARGET_SYMBOL || '').split(',').filter(Boolean)) console.log(s, JSON.stringify(d[s]));"
          node -e "const d = require('./pfcfTrendCache.json').trends; for (const s of (process.env.TARGET_SYMBOL || '').split(',').filter(Boolean)) console.log(s, 'pe:', JSON.stringify(d[s]?.pe));"

      # pfcfTrendCache.json is the DOMESTIC pipeline's own file (11+MB) --
      # this script only ever touches the `.pe` key of the foreign tickers
      # it itself processed (see the script's own comments near
      # GIST_PFCF_TREND_URL/OUTPUT_PE_FILE), so publishing it here is
      # additive to whatever the domestic pipeline's own runs already
      # wrote, never a wholesale replace. Both files committed together so
      # a rejected push retries both from the same fresh clone.
      - name: Publish to gist
        if: ${{ !inputs.dryRun }}
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -e
          CLONE_URL="https://${GIST_TOKEN}@gist.github.com/${GIST_ID}.git"
          attempt=1
          while true; do
            rm -rf gist-clone
            git clone --depth 1 "$CLONE_URL" gist-clone
            if diff -q foreignPfcfCache.json gist-clone/foreignPfcfCache.json >/dev/null 2>&1 && \
               diff -q pfcfTrendCache.json gist-clone/pfcfTrendCache.json >/dev/null 2>&1; then
              echo "No changes to publish."
              break
            fi
            EXPECTED_SHA=$(git -C gist-clone rev-parse HEAD)
            cp foreignPfcfCache.json gist-clone/foreignPfcfCache.json
            cp pfcfTrendCache.json gist-clone/pfcfTrendCache.json
            ( cd gist-clone
              git config user.email "actions@github.com"
              git config user.name "foreign-filings-pipeline"
              git checkout --orphan latest-snapshot
              git add -A
              git commit -m "Update foreign P/FCF + P/E cache $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git branch -M main
              git push --force-with-lease="main:${EXPECTED_SHA}" origin main
            ) && { echo "Published on attempt $attempt."; break; }
            attempt=$((attempt + 1))
            if [ "$attempt" -gt 5 ]; then
              echo "::error::Publish rejected 5 times in a row -- the gist kept changing underneath this run. Not forcing; re-dispatch once things settle."
              exit 1
            fi
            echo "Push rejected (remote moved since clone) — retrying with a fresh fetch (attempt ${attempt}/5)..."
          done

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'foreign-pfcf-pipeline-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Foreign P/FCF cache pipeline failed',
                body: `The daily generation run failed.\n\nRun: ${runUrl}\n\nCheck the TWELVEDATA_FOREIGN_PIPELINE_API_KEY, GIST_TOKEN, and GIST_ID secrets, and SEC EDGAR's/Twelve Data's API status. Note: this is separate from generate-foreign-filings-cache.yml — that job is unaffected.`,
                labels: [label],
              });
            }

      - name: Close failure issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'foreign-pfcf-pipeline-failure';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Foreign P/FCF cache pipeline succeeded again — closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
